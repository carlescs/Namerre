name: Sync labels

# Creates or updates the repository's issue and pull request labels from .github/labels.json.
# Labels missing from the file are left alone, so nothing already applied to an issue is deleted.
on:
  push:
    branches: [main]
    paths:
      - .github/labels.json
      - .github/workflows/labels.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create or update labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -c '.[]' .github/labels.json | while read -r label; do
            gh label create "$(jq -r .name <<< "$label")" \
              --color "$(jq -r .color <<< "$label")" \
              --description "$(jq -r .description <<< "$label")" \
              --force
          done
