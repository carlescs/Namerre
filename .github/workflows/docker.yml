name: Build and publish Docker image

# Images are built and published only for version tags (vX.Y.Z or vX.Y.Z-pre.N).
# Tags pushed by the "Create version tag" workflow dispatch this workflow on the tag ref,
# because pushes made with GITHUB_TOKEN do not trigger other workflows.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - name: Require a version tag
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF" != refs/tags/* || ! "$REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-pre\.[1-9][0-9]*)?$ ]]; then
            echo "::error::Docker images are published only for version tags (vX.Y.Z or vX.Y.Z-pre.N); got $REF. Use the 'Create version tag' workflow to cut a release or pre-release."
            exit 1
          fi

  tests:
    needs: version
    uses: ./.github/workflows/backend.yml
    secrets:
      CMEDIATOR_PACKAGES_TOKEN: ${{ secrets.CMEDIATOR_PACKAGES_TOKEN }}

  docker:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.metadata.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=prerelease,enable=${{ contains(github.ref_name, '-') }}
            type=raw,value=${{ github.ref_name }}
            type=sha

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Namerre.Api/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          secrets: |
            github_packages_credentials=Username=${{ github.repository_owner }};Password=${{ secrets.CMEDIATOR_PACKAGES_TOKEN }};ValidAuthenticationTypes=Basic
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: docker
    concurrency:
      group: publish-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish release with change summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          IMAGE_TAGS: ${{ needs.docker.outputs.tags }}
          IMAGE_DIGEST: ${{ needs.docker.outputs.digest }}
        run: |
          set -euo pipefail

          release_tag="$REF_NAME"
          release_title="$REF_NAME"
          release_options=(--verify-tag)
          if [[ "$REF_NAME" == *-* ]]; then
            release_options+=(--prerelease --latest=false)
          fi

          # Every release (stable or pre-release) lists everything it contains relative to the
          # previous stable version reachable from this commit, so a stable release also includes
          # the changes that were first shipped in its pre-releases.
          # The baseline must be strictly older than this release's version: a pre-release
          # vX.Y.Z-pre.N never uses vX.Y.Z (e.g. promoted on the same commit) or anything newer.
          stable_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          release_version="${release_tag%%-*}"
          previous_tag=""
          while IFS= read -r tag; do
            if [[ -n "$tag" && "$tag" != "$release_version" && "$tag" =~ $stable_pattern \
              && "$(printf '%s\n%s\n' "$tag" "$release_version" | sort -V | head -n1)" == "$tag" ]]; then
              previous_tag="$tag"
              break
            fi
          done < <(git tag --merged "$COMMIT_SHA" --sort=-version:refname --list 'v*')

          if [[ -n "$previous_tag" ]]; then
            log_range="$previous_tag..$COMMIT_SHA"
            changes_heading="Changes since $previous_tag"
            release_options+=(--notes-start-tag "$previous_tag")
          else
            log_range="$COMMIT_SHA"
            changes_heading="Changes"
          fi

          changes=$(git log --no-merges --format='- %s (%h)' "$log_range")
          if [[ -z "$changes" ]]; then
            changes="- No code changes."
          fi
          release_notes=$(printf '## %s\n\n%s\n\n## Docker image\n\n```text\n%s\n```\n\nDigest: `%s`\n' \
            "$changes_heading" "$changes" "$IMAGE_TAGS" "$IMAGE_DIGEST")
          gh release create "$release_tag" \
            --target "$COMMIT_SHA" \
            --title "$release_title" \
            --generate-notes \
            --notes "$release_notes" \
            "${release_options[@]}"

          gh release view "$release_tag" --json body --jq .body >> "$GITHUB_STEP_SUMMARY"
