name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/backend.yml
    secrets:
      CMEDIATOR_PACKAGES_TOKEN: ${{ secrets.CMEDIATOR_PACKAGES_TOKEN }}

  docker:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.metadata.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=raw,value=prerelease,enable=${{ github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')) }}
            type=ref,event=tag
            type=ref,event=pr
            type=sha

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Namerre.Api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          secrets: |
            github_packages_credentials=Username=${{ github.repository_owner }};Password=${{ secrets.CMEDIATOR_PACKAGES_TOKEN }};ValidAuthenticationTypes=Basic
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: docker
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    concurrency:
      group: publish-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish release with change summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          IMAGE_TAGS: ${{ needs.docker.outputs.tags }}
          IMAGE_DIGEST: ${{ needs.docker.outputs.digest }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            release_tag="$REF_NAME"
            release_title="$REF_NAME"
            release_options=(--verify-tag)
            if [[ "$REF_NAME" == *-* ]]; then
              release_options+=(--prerelease --latest=false)
            fi
            tag_patterns=('v*')
          else
            version_tags=$(git tag --list 'v*' --sort=-version:refname)
            stable_tag=""
            while IFS= read -r tag; do
              if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                stable_tag="$tag"
                break
              fi
            done <<< "$version_tags"
            version="0.1.0"
            if [[ -n "$stable_tag" ]]; then
              IFS=. read -r major minor patch <<< "${stable_tag#v}"
              version="${major}.${minor}.$((10#$patch + 1))"
            fi
            prerelease_number=1
            while IFS= read -r tag; do
              if [[ "$tag" == "v${version}-pre."* && "${tag##*.}" =~ ^[1-9][0-9]*$ ]]; then
                prerelease_number=$((${tag##*.} + 1))
                break
              fi
            done <<< "$version_tags"
            release_tag="v${version}-pre.${prerelease_number}"
            release_title="$release_tag"
            release_options=(--prerelease --latest=false)
            tag_patterns=('main-*' 'v*')
          fi

          previous_tags=$(git tag --merged "$COMMIT_SHA" --sort=-creatordate --list "${tag_patterns[@]}")
          log_range="$COMMIT_SHA"
          while IFS= read -r previous_tag; do
            if [[ -n "$previous_tag" && "$previous_tag" != "$release_tag" ]]; then
              log_range="$previous_tag..$COMMIT_SHA"
              release_options+=(--notes-start-tag "$previous_tag")
              break
            fi
          done <<< "$previous_tags"

          changes=$(git log --format='- %s (%h)' "$log_range")
          release_notes=$(printf '## Changes\n\n%s\n\n## Docker image\n\n```text\n%s\n```\n\nDigest: `%s`\n' "$changes" "$IMAGE_TAGS" "$IMAGE_DIGEST")
          gh release create "$release_tag" \
            --target "$COMMIT_SHA" \
            --title "$release_title" \
            --generate-notes \
            --notes "$release_notes" \
            "${release_options[@]}"

          gh release view "$release_tag" --json body --jq .body >> "$GITHUB_STEP_SUMMARY"
