name: Build and publish Docker image

# Images are built and published only for version tags (vX.Y.Z or vX.Y.Z-pre.N).
# Tags created by semantic-release (release.yml) dispatch this workflow on the tag ref,
# because pushes made with GITHUB_TOKEN do not trigger other workflows.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - name: Require a version tag
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF" != refs/tags/* || ! "$REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-pre\.[1-9][0-9]*)?$ ]]; then
            echo "::error::Docker images are published only for version tags (vX.Y.Z or vX.Y.Z-pre.N); got $REF. Releases are cut by semantic-release when Conventional Commits land on main (stable) or next (pre-release)."
            exit 1
          fi

  tests:
    needs: version
    uses: ./.github/workflows/backend.yml
    secrets:
      CMEDIATOR_PACKAGES_TOKEN: ${{ secrets.CMEDIATOR_PACKAGES_TOKEN }}

  docker:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.metadata.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=prerelease,enable=${{ contains(github.ref_name, '-') }}
            type=raw,value=${{ github.ref_name }}
            type=sha

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Namerre.Api/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          secrets: |
            github_packages_credentials=Username=${{ github.repository_owner }};Password=${{ secrets.CMEDIATOR_PACKAGES_TOKEN }};ValidAuthenticationTypes=Basic
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: docker
    concurrency:
      group: publish-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Add the Docker image to the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          IMAGE_TAGS: ${{ needs.docker.outputs.tags }}
          IMAGE_DIGEST: ${{ needs.docker.outputs.digest }}
        run: |
          set -euo pipefail

          image_notes=$(printf '## Docker image\n\n```text\n%s\n```\n\nDigest: `%s`\n' "$IMAGE_TAGS" "$IMAGE_DIGEST")

          # semantic-release normally creates the release (with the Conventional Commits changelog)
          # before dispatching this workflow; a tag pushed by hand gets a release with GitHub's
          # generated notes instead.
          if existing_notes=$(gh release view "$REF_NAME" --json body --jq .body 2>/dev/null); then
            gh release edit "$REF_NAME" --notes "$(printf '%s\n\n%s\n' "$existing_notes" "$image_notes")"
          else
            release_options=(--verify-tag)
            if [[ "$REF_NAME" == *-* ]]; then
              release_options+=(--prerelease --latest=false)
            fi
            gh release create "$REF_NAME" \
              --target "$COMMIT_SHA" \
              --title "$REF_NAME" \
              --generate-notes \
              --notes "$image_notes" \
              "${release_options[@]}"
          fi

          gh release view "$REF_NAME" --json body --jq .body >> "$GITHUB_STEP_SUMMARY"
