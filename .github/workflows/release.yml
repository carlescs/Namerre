name: Release

# Every push to main (stable vX.Y.Z) or next (pre-release vX.Y.Z-pre.N) runs CI, then
# semantic-release derives the next version from the Conventional Commits since the last release
# and the Docker image is published for the new tag. Pushes without feat/fix/perf or
# breaking-change commits publish nothing.
on:
  push:
    branches: [main, next]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets:
      CMEDIATOR_PACKAGES_TOKEN: ${{ secrets.CMEDIATOR_PACKAGES_TOKEN }}

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag and create the GitHub release
    outputs:
      tag: ${{ steps.semantic-release.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js and install release tooling
        uses: ./.github/actions/setup-node
        with:
          ci-args: --ignore-scripts

      - name: Publish release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  # The commit was just tested by the ci job, so docker.yml skips its own CI run.
  docker:
    needs: release
    if: needs.release.outputs.tag != ''
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: write # append the image to the release notes
      packages: write # push the image to ghcr.io
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets:
      CMEDIATOR_PACKAGES_TOKEN: ${{ secrets.CMEDIATOR_PACKAGES_TOKEN }}
