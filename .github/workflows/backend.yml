name: Build and test backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      NuGetPackageSourceCredentials_Github: Username=${{ github.repository_owner }};Password=${{ secrets.CMEDIATOR_PACKAGES_TOKEN }};ValidAuthenticationTypes=Basic
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Namerre.Front/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix Namerre.Front

      - name: Restore
        run: dotnet restore Namerre.slnx

      - name: Build
        run: dotnet build Namerre.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Namerre.Api.Tests/Namerre.Api.Tests.csproj --configuration Release --no-build --no-restore
