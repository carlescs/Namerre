name: Build and test application

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
    secrets:
      CMEDIATOR_PACKAGES_TOKEN:
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      NuGetPackageSourceCredentials_Github: Username=${{ github.repository_owner }};Password=${{ secrets.CMEDIATOR_PACKAGES_TOKEN }};ValidAuthenticationTypes=Basic
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Namerre.Front/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix Namerre.Front

      - name: Restore
        run: dotnet restore Namerre.slnx

      - name: Build
        run: dotnet build Namerre.slnx --configuration Release --no-restore

      - name: Test with coverage
        run: >-
          dotnet test Namerre.slnx --configuration Release --no-build --no-restore
          --collect:"XPlat Code Coverage" --logger trx --results-directory TestResults

      - name: Upload backend test results and coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-results-${{ matrix.os }}
          path: TestResults/
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Namerre.Front/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix Namerre.Front

      - name: Lint and check formatting
        working-directory: Namerre.Front
        run: npm run lint

      - name: Test with coverage
        working-directory: Namerre.Front
        run: npm test -- --watch=false --coverage --coverage-reporters=text-summary --coverage-reporters=html --coverage-reporters=cobertura

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: Namerre.Front/coverage/
          if-no-files-found: error
