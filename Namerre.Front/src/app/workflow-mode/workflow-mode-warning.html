<app-confirm-dialog
  heading="Switch to Simple mode?"
  confirmLabel="Discard steps and switch"
  cancelLabel="Keep Advanced"
  danger
  (confirmed)="workflow.confirm()"
  (cancelled)="workflow.cancel()"
>
  <p>
    This pipeline uses advanced steps. Switching to Simple will discard them. Your selected files
    are kept, and prepared plans and runs are not affected.
  </p>
</app-confirm-dialog>
