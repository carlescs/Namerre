<div class="mode-picker" role="group" aria-label="Workflow mode">
  @for (option of options; track option.value) {
    <button
      type="button"
      [attr.aria-pressed]="workflow.mode() === option.value"
      [title]="option.title"
      (click)="void workflow.request(option.value)"
    >
      {{ option.label }}
    </button>
  }
</div>
