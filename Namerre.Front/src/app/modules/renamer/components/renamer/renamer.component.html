<main id="main-content" tabindex="-1" class="mx-auto max-w-7xl px-4 py-6 sm:px-8 sm:py-8">
  <div class="mb-6">
    <h1 class="mb-1">Renamer</h1>
    <p class="m-0 text-slate-500 dark:text-slate-400">
      Pick files, set up renaming rules and review every change before anything is renamed.
    </p>
    @if (restoredCount) {
      <p class="mb-0 mt-2 text-xs text-slate-500 dark:text-slate-400" role="status">
        Restored {{ restoredCount }} {{ restoredCount === 1 ? 'file' : 'files' }} from your last
        visit in this browser. Use Clear collection to start over.
      </p>
    }
  </div>
  <app-rename-workflow
    [files]="files()"
    [includeRelated]="includeRelated()"
    (fileRemoved)="removeFile($event)"
  >
    <app-file-selection
      [files]="files()"
      [(includeRelated)]="includeRelated"
      (filesChanged)="files.set($event)"
    />
  </app-rename-workflow>
</main>
