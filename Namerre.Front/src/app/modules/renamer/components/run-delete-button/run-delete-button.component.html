@if (auth.isAdmin()) {
  <button
    type="button"
    class="shrink-0 text-slate-500 dark:text-slate-400 hover:text-rose-700 dark:hover:text-rose-400 disabled:hover:text-slate-500 dark:disabled:hover:text-slate-400"
    [attr.aria-label]="
      'Delete ' + (kindLabel(run().kind) | lowercase) + ' record: ' + runTitle(run())
    "
    [title]="
      isSettledRun(run()) ? 'Delete this record' : 'Only completed or recovered runs can be deleted'
    "
    (click)="requested.emit(run().id)"
    [disabled]="!isSettledRun(run()) || disabled()"
  >
    <fa-icon [icon]="trashIcon" aria-hidden="true" />
  </button>
}
