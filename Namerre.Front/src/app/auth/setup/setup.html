<main>
  <app-logo class="mb-6 size-12" />
  <p class="eyebrow">Make yourself at home</p>
  <h1>Set up Namerre</h1>
  <p class="text-slate-500 dark:text-slate-400">
    Create the administrator account. Copy the one-time setup token from the server console.
  </p>
  <app-single-sign-on />
  <form [formGroup]="form" (ngSubmit)="submit()" [attr.aria-busy]="busy()">
    <label for="setup-token">Setup token</label>
    <input
      id="setup-token"
      type="password"
      formControlName="token"
      autocomplete="off"
      minlength="64"
      maxlength="64"
      required
    />
    <label for="setup-username">Administrator username</label>
    <input
      id="setup-username"
      formControlName="username"
      autocomplete="username"
      maxlength="128"
      required
    />
    <label for="setup-password">Password</label>
    <input
      id="setup-password"
      type="password"
      formControlName="password"
      autocomplete="new-password"
      maxlength="1024"
      required
    />
    <label for="setup-confirmation">Confirm password</label>
    <input
      id="setup-confirmation"
      type="password"
      formControlName="confirmation"
      autocomplete="new-password"
      maxlength="1024"
      required
    />
    @if (form.hasError('passwordMismatch') && form.controls.confirmation.dirty) {
      <p role="alert">Passwords must match.</p>
    }
    @if (error()) {
      <p role="alert">{{ error() }}</p>
    }
    <button class="btn-primary mt-4 w-full" type="submit" [disabled]="busy() || form.invalid">
      {{ busy() ? 'Saving...' : 'Create administrator' }}
    </button>
  </form>
</main>
