<main>
  <div
    class="mb-6 grid size-12 place-items-center rounded-2xl bg-indigo-600 text-2xl font-bold text-white"
    aria-hidden="true"
  >
    N
  </div>
  <p class="eyebrow">Welcome back</p>
  <h1>Sign in to Namerre</h1>
  <p class="mb-6 text-slate-500 dark:text-slate-400">
    Your self-hosted workspace for a more organized library.
  </p>
  <app-single-sign-on />
  <form [formGroup]="form" (ngSubmit)="submit()" [attr.aria-busy]="busy()">
    <label for="username">Username</label>
    <input
      id="username"
      formControlName="username"
      autocomplete="username"
      maxlength="128"
      required
    />
    <label for="password">Password</label>
    <input
      id="password"
      type="password"
      formControlName="password"
      autocomplete="current-password"
      maxlength="1024"
      required
    />
    @if (error()) {
      <p role="alert">{{ error() }}</p>
    }
    <button class="btn-primary mt-4 w-full" type="submit" [disabled]="busy() || form.invalid">
      {{ busy() ? 'Signing in...' : 'Sign in' }}
    </button>
  </form>
  <p class="mb-0 mt-6 text-center text-xs text-slate-500 dark:text-slate-400">
    Your files stay on your server.
  </p>
</main>
