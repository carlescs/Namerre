@if (error()) {
  <p role="alert">{{ error() }}</p>
}
@if (auth.singleSignOn(); as provider) {
  <button class="btn-primary w-full" type="button" (click)="signIn()" [disabled]="redirecting()">
    {{ redirecting() ? 'Redirecting...' : 'Sign in with ' + provider.displayName }}
  </button>
  <p class="my-4 text-center text-xs text-slate-500 dark:text-slate-400">or</p>
}
