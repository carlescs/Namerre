<div class="theme-picker" role="group" aria-label="Color theme">
  @for (option of options; track option.value) {
    <button
      type="button"
      [attr.aria-pressed]="theme.preference() === option.value"
      [attr.aria-label]="option.label"
      [title]="option.label"
      (click)="theme.select(option.value)"
    >
      <fa-icon [icon]="option.icon" aria-hidden="true" />
    </button>
  }
</div>
