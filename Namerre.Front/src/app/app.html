@if (loading()) {
  <div class="grid min-h-dvh place-items-center">
    <p class="badge" role="status">Connecting to Namerre...</p>
  </div>
} @else {
  @if (error()) {
    <p class="mx-auto max-w-3xl" role="alert">{{ error() }}</p>
  }
  @if (auth.username(); as username) {
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="border-b border-slate-200 bg-white">
      <div class="mx-auto flex max-w-7xl flex-wrap items-center gap-4 px-4 py-4 sm:px-8">
        <a
          routerLink="/"
          class="flex items-center gap-3 text-slate-950 no-underline hover:no-underline"
        >
          <span
            class="grid size-10 place-items-center rounded-xl bg-indigo-600 text-xl font-bold text-white"
            aria-hidden="true"
            >N</span
          >
          <span class="text-xl font-bold tracking-tight"
            >namerre<span class="text-indigo-600">.</span></span
          >
        </a>
        <nav
          class="order-2 flex w-full gap-1 sm:order-none sm:ml-8 sm:w-auto"
          aria-label="Main navigation"
        >
          <a
            routerLink="/"
            routerLinkActive="nav-active"
            [routerLinkActiveOptions]="{ exact: true }"
            ariaCurrentWhenActive="page"
            class="nav-link"
            >Workspace</a
          >
          <a
            routerLink="/runs"
            routerLinkActive="nav-active"
            ariaCurrentWhenActive="page"
            class="nav-link"
            >Run history</a
          >
        </nav>
        <div class="ml-auto flex min-w-0 items-center gap-3">
          <span class="hidden max-w-48 truncate text-xs text-slate-500 sm:block" [title]="username"
            >Signed in as <strong class="text-slate-700">{{ username }}</strong></span
          >
          <button type="button" (click)="logout()" [disabled]="signingOut()">Sign out</button>
        </div>
      </div>
    </header>
    <router-outlet />
  } @else if (error()) {
    <div class="text-center"><button type="button" (click)="initialize()">Retry</button></div>
  } @else if (auth.requiresSetup()) {
    <app-setup />
  } @else {
    <app-login />
  }
}
