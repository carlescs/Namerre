<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Namerre</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Apply the saved theme before first paint; the Theme service keeps it in sync afterwards.
      (function () {
        var preference = null;
        try {
          preference = localStorage.getItem('namerre-theme');
        } catch (e) {}
        var dark =
          preference === 'dark' ||
          (preference !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
